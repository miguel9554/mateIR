name: Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker images
        run: bash scripts/docker-build.sh

      - name: Run full regression in Docker
        run: scripts/docker-run.sh python tests/regression.py

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/regression
          if-no-files-found: warn
