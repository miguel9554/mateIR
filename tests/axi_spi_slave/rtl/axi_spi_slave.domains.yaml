module_name: axi_spi_slave
resets:
  axi_aresetn:
    polarity: negative
  spi_cs:
    polarity: positive
clock_domains:
  axi_aclk:
    polarity: posedge
    inputs_outputs:
    - axi_master_aw_ready
    - axi_master_ar_ready
    - axi_master_w_ready
    - axi_master_r_valid
    - axi_master_r_data
    - axi_master_r_resp
    - axi_master_r_last
    - axi_master_r_id
    - axi_master_r_user
    - axi_master_b_valid
    - axi_master_b_resp
    - axi_master_b_id
    - axi_master_b_user
  spi_sclk:
    polarity: posedge
    inputs_outputs:
    - spi_sdi0
    - spi_sdi1
    - spi_sdi2
    - spi_sdi3
async_domain:
- test_mode
