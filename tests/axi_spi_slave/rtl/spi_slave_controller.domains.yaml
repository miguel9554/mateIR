module_name: spi_slave_controller

resets:
  cs:
    polarity: positive
  sys_rstn:
    polarity: negative

clock_domains:
  sclk:
    polarity: posedge
    inputs_outputs:
      - rx_data
      - rx_data_valid
      - tx_done
      - ctrl_data_rx_ready
      - ctrl_data_tx
      - ctrl_data_tx_valid
      - en_quad
      - pad_mode
      - rx_counter
      - rx_counter_upd
      - tx_counter
      - tx_counter_upd
      - tx_data
      - tx_data_valid
      - ctrl_rd_wr
      - ctrl_addr
      - ctrl_addr_valid
      - ctrl_data_rx
      - ctrl_data_rx_valid
      - ctrl_data_tx_ready
      - wrap_length
