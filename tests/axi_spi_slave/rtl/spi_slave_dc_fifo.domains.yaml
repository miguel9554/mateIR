module_name: spi_slave_dc_fifo

resets:
  rstn_a:
    polarity: negative
  rstn_b:
    polarity: negative

clock_domains:
  clk_a:
    polarity: posedge
    inputs_outputs:
      - data_a
      - valid_a
      - ready_a

  clk_b:
    polarity: posedge
    inputs_outputs:
      - ready_b
      - data_b
      - valid_b
