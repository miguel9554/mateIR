module_name: spi_slave_syncro

resets:
  rstn:
    polarity: negative

clock_domains:
  sys_clk:
    polarity: posedge
    inputs_outputs:
      - cs_sync
      - address_sync
      - address_valid_sync
      - rd_wr_sync

async_domain:
  - cs:
      synchronized_into: sys_clk
  - address:
      synchronized_into: sys_clk
  - address_valid:
      synchronized_into: sys_clk
  - rd_wr:
      synchronized_into: sys_clk
